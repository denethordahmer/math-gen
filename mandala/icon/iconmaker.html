<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icon Maker: Mandala</title>
<style>
  :root {
    --bg: #07080d; --panel: #10131c; --panel2: #161a26; --panel3: #1c2130;
    --border: #242a3a; --borderStrong: #333a4d; --text: #eef0f7; --dim: #8b90a6;
    --accent: #7c5cff; --accent2: #a58bff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .wrap {
    width: 90%; max-width: 440px; padding: 32px 24px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  h1 {
    margin: 0; font-size: 24px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, var(--text), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  p { margin: 0 0 8px 0; color: var(--dim); font-size: 14px; text-align: center; line-height: 1.5; }
  .btn {
    background: var(--panel2); border: 1px solid var(--borderStrong);
    color: var(--text); padding: 14px; border-radius: 12px; font-weight: 700;
    cursor: pointer; text-align: center; transition: 0.15s ease; font-size: 14px;
  }
  .btn:hover { background: var(--panel3); border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0b10; border: none; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Icon Generator</h1>
  <p>Generate styled offline asset icons required for the Mandala PWA manifest installation.</p>
  <button class="btn" id="btn192">Generate icon-192.png</button>
  <button class="btn" id="btn512">Generate icon-512.png</button>
  <button class="btn primary" id="btnMaskable">Generate maskable-512.png</button>
</div>

<canvas id="iconCanvas"></canvas>

<script src="../mandala-engine.js"></script>
<script>
  const canvas = document.getElementById("iconCanvas");
  const ctx = canvas.getContext("2d");

  /* One fixed recipe, so every size is the same picture. Lattice reads as a
     clear rosette at 192px; ember keeps the contrast high on a dark tile. */
  const RECIPE = {
    style: "lattice",
    seed: "mandala-icon",
    palette: "ember",
    contrast: 82,
    rotation: 0,
    grain: 0,
    vignette: 0,
    opts: { fold: 16, rings: 7, shape: 0, widen: 55, detail: 3 }
  };

  /* A maskable icon bleeds to all four edges, and only the central 80% is
     guaranteed to survive the launcher's crop. The lattice picture already
     has its rings inside a dark rim, so drawing it full size keeps the
     content in the safe zone and leaves no seam at the edges. */
  function drawMandala(size, isMaskable) {
    canvas.width = size; canvas.height = size;
    ctx.clearRect(0, 0, size, size);
    window.Mandala.draw(ctx, size, size, RECIPE);
  }

  function download(filename, size, isMaskable) {
    drawMandala(size, isMaskable);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }, "image/png");
  }

  document.getElementById("btn192").addEventListener("click", () => download("icon-192.png", 192, false));
  document.getElementById("btn512").addEventListener("click", () => download("icon-512.png", 512, false));
  document.getElementById("btnMaskable").addEventListener("click", () => download("maskable-512.png", 512, true));
</script>
</body>
</html>
